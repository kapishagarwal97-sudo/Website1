<style>
/* ============================================================
   TRYB — find your table
   Palette and type follow css/style.css.
   ============================================================ */
:root{
  --ink:#1e2a44;
  --ink-2:#182238;
  --bronze:#b07a4b;
  --sand:#d7cec3;
  --cream:#f7f2ea;
  --ember:#eb642e;

  --font-script:"Pacifico",cursive;
  --font-display:"Fraunces","Times New Roman",serif;
  --font-sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

  --ease:cubic-bezier(.16,1,.3,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --gutter:clamp(1.25rem,5vw,6rem);
  --hud:96px;
}
*,*::before,*::after{box-sizing:border-box}
*{margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{
  min-height:100vh;min-height:100dvh;
  background:var(--ink);color:var(--cream);
  font-family:var(--font-sans);font-weight:300;line-height:1.6;
  overflow-x:hidden;-webkit-tap-highlight-color:transparent;
}
::selection{background:var(--ember);color:var(--cream)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(60vw 60vw at 78% -10%, rgba(176,122,75,.16), transparent 60%),
    radial-gradient(50vw 50vw at 8% 108%, rgba(235,100,46,.10), transparent 62%);
  animation:drift 26s ease-in-out infinite alternate;
}
@keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(-2%,1.5%,0)}}

/* ============================================================
   The walk to the table — this is the progress indicator.
   A token travels a dotted path toward the one empty seat.
   ============================================================ */
.hud{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  padding:0 var(--gutter) 1.1rem;
  background:linear-gradient(to top, var(--ink) 55%, rgba(30,42,68,0));
  pointer-events:none;
}
.hud__inner{display:flex;align-items:center;gap:.9rem;max-width:1100px;margin:0 auto}
.hud__track{
  position:relative;flex:1;height:22px;
}
.hud__track::before{
  content:"";position:absolute;left:0;right:0;top:50%;height:1px;
  background:repeating-linear-gradient(to right, rgba(215,206,195,.42) 0 3px, transparent 3px 10px);
}
.hud__you{
  position:absolute;top:50%;left:0;
  width:11px;height:11px;border-radius:50%;
  background:var(--ember);
  box-shadow:0 0 0 4px rgba(235,100,46,.16), 0 0 16px rgba(235,100,46,.5);
  transform:translate(-50%,-50%);
  transition:left .75s var(--spring);
}
.hud__you::after{                       /* a faint trail behind the walker */
  content:"";position:absolute;right:100%;top:50%;width:26px;height:1px;
  background:linear-gradient(to left, rgba(235,100,46,.5), transparent);
  transform:translateY(-50%);
}
.hud.step .hud__you{animation:bob .75s var(--ease)}
@keyframes bob{0%,100%{margin-top:0}45%{margin-top:-5px}}

.hud__table{width:68px;height:68px;flex:0 0 auto;margin-left:-8px}
.seat{fill:var(--sand);opacity:.85;transform-origin:center}
.seat--empty{
  fill:none;stroke:var(--ember);stroke-width:1.6;stroke-dasharray:2.4 2.4;
  transform-origin:center;animation:waiting 2.6s ease-in-out infinite;
}
@keyframes waiting{0%,100%{opacity:.55}50%{opacity:1}}
.tabletop{fill:rgba(215,206,195,.07);stroke:rgba(215,206,195,.4);stroke-width:1}
.hud.arrived .seat--empty{fill:var(--ember);stroke:var(--ember);stroke-dasharray:none;opacity:1;animation:none}
.hud.arrived .seat{animation:greet .6s var(--spring) both}
.hud.arrived .seat:nth-of-type(2){animation-delay:.05s}
.hud.arrived .seat:nth-of-type(3){animation-delay:.1s}
.hud.arrived .seat:nth-of-type(4){animation-delay:.15s}
.hud.arrived .seat:nth-of-type(5){animation-delay:.2s}
@keyframes greet{0%{transform:scale(1)}50%{transform:scale(1.45)}100%{transform:scale(1)}}
.hud.arrived .hud__you{opacity:0;transition:opacity .3s ease}

.hud__note{
  max-width:1100px;margin:.55rem auto 0;
  font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;
  color:var(--sand);opacity:.5;
}
.hud.arrived .hud__note{color:var(--ember);opacity:.9}

/* ---------- shell ---------- */
.wrap{
  position:relative;z-index:1;
  min-height:100vh;min-height:100dvh;
  display:grid;grid-template-rows:auto 1fr auto;
  padding:clamp(1.1rem,3vw,2rem) var(--gutter) calc(var(--hud) + .5rem);
}
.top{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.brand{display:flex;align-items:center}
.brand img{height:30px;width:auto}
.brand__text{font-family:var(--font-display,"Fraunces",serif);font-size:1.3rem;letter-spacing:.18em;text-transform:uppercase;line-height:1;color:var(--cream,#f7f2ea)}
.part{font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;color:var(--sand);opacity:.55;text-align:right}

.stage{display:flex;align-items:center;width:100%;max-width:820px;margin:0 auto;padding:clamp(1rem,3.5vh,2.4rem) 0}
.card{width:100%;transition:opacity .28s ease,transform .28s var(--ease),filter .28s ease}
.card.is-out{opacity:0;transform:translateY(-18px);filter:blur(2px)}
.card.is-in{animation:enter .6s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.eyebrow{font-size:.68rem;letter-spacing:.26em;text-transform:uppercase;color:var(--bronze);margin-bottom:1.1rem}
.q{
  font-family:var(--font-display);font-weight:400;
  font-size:clamp(1.4rem,3.6vw,2.35rem);
  line-height:1.16;letter-spacing:-.01em;max-width:24ch;
}
.lede{margin-top:1.1rem;max-width:46ch;color:var(--sand);font-size:clamp(.95rem,1.5vw,1.05rem)}
.sub{margin-top:.7rem;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--sand);opacity:.45}

/* ---------- timer (rapid fire only) ---------- */
.timer{
  display:flex;align-items:center;gap:.7rem;margin-top:1.3rem;
  opacity:0;transform:translateY(6px);
  transition:opacity .4s ease,transform .4s var(--ease);
}
.timer.on{opacity:1;transform:none}
.timer__track{position:relative;flex:1;height:2px;max-width:340px;background:rgba(215,206,195,.2)}
.timer__bar{position:absolute;inset:0 auto 0 0;width:100%;background:var(--sand);transform-origin:left center}
.timer__num{font-family:var(--font-display);font-size:.95rem;color:var(--sand);opacity:.7;min-width:2ch;font-variant-numeric:tabular-nums}
.timer.warn .timer__bar{background:var(--ember)}
.timer.warn .timer__num{color:var(--ember);opacity:1}

/* ---------- likert ---------- */
.scale{margin-top:clamp(1.6rem,4vh,2.6rem);width:100%;--dot-base:38px}
.scale--8 {max-width:560px;--dot-step:4.5px}
.scale--11{max-width:660px;--dot-step:2.4px}
.dots{display:flex;align-items:center;justify-content:space-between;gap:clamp(.3rem,1.6vw,.75rem)}
.dot{
  position:relative;flex:0 0 auto;
  /* --k = distance from the middle, so the extremes read heavier */
  width:calc(var(--dot-base) + var(--k) * var(--dot-step));
  aspect-ratio:1;
  display:grid;place-items:center;border-radius:50%;
  border:1px solid rgba(215,206,195,.35);color:var(--sand);
  font-family:var(--font-display);font-size:.95rem;
  animation:rise .45s var(--ease) both;animation-delay:calc(var(--i) * 40ms);
  transition:transform .35s var(--ease),background .25s ease,border-color .25s ease,color .25s ease;
}
.dot:hover,.dot:focus-visible{border-color:var(--cream);color:var(--cream);transform:translateY(-3px) scale(1.06);outline:none}
.dot.sel{background:var(--ember);border-color:var(--ember);color:var(--cream);transform:scale(1.08)}
.dot.sel::after{
  content:"";position:absolute;inset:-7px;border-radius:50%;
  border:1px solid rgba(235,100,46,.4);animation:ping .5s var(--ease) both;
}
@keyframes ping{from{transform:scale(.8);opacity:1}to{transform:scale(1);opacity:1}}
.ends{
  display:flex;justify-content:space-between;gap:1rem;margin-top:1.1rem;
  font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--sand);opacity:.55;
}
.ends span{flex:1}
.ends span:nth-child(2){text-align:center}
.ends span:last-child{text-align:right}

/* ---------- single choice ---------- */
.choices{margin-top:clamp(1.4rem,3.5vh,2.2rem);display:grid;gap:.55rem;max-width:680px}
.choice{
  display:flex;align-items:center;gap:1rem;width:100%;
  padding:.95rem 1.1rem;text-align:left;
  border:1px solid rgba(215,206,195,.22);border-radius:2px;color:var(--cream);
  font-size:clamp(.92rem,1.5vw,1.05rem);line-height:1.35;
  animation:rise .5s var(--ease) both;animation-delay:calc(var(--i) * 45ms);
  transition:border-color .25s ease,background .25s ease,transform .3s var(--ease);
}
.choice:hover,.choice:focus-visible{border-color:var(--sand);background:rgba(247,242,234,.04);transform:translateX(5px);outline:none}
.choice__key{
  flex:0 0 auto;width:25px;height:25px;display:grid;place-items:center;
  border:1px solid rgba(215,206,195,.35);border-radius:50%;
  font-family:var(--font-display);font-size:.7rem;color:var(--sand);
  transition:background .25s ease,border-color .25s ease,color .25s ease;
}
.choice.sel{border-color:var(--ember);background:rgba(235,100,46,.1)}
.choice.sel .choice__key{background:var(--ember);border-color:var(--ember);color:var(--cream)}

/* ---------- rapid fire: two big tiles ---------- */
.rapid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-top:clamp(1.4rem,4vh,2.4rem);max-width:720px}
.tile{
  position:relative;overflow:hidden;
  min-height:clamp(120px,20vh,168px);
  display:grid;place-items:center;text-align:center;padding:1.4rem 1rem;
  border:1px solid rgba(215,206,195,.25);border-radius:3px;
  font-family:var(--font-display);font-size:clamp(1.05rem,2.4vw,1.5rem);line-height:1.2;
  animation:rise .5s var(--spring) both;animation-delay:calc(var(--i) * 90ms);
  transition:border-color .25s ease,background .25s ease,transform .35s var(--spring);
}
.tile:hover,.tile:focus-visible{border-color:var(--cream);background:rgba(247,242,234,.05);transform:translateY(-4px);outline:none}
.tile.sel{border-color:var(--ember);background:rgba(235,100,46,.16);transform:scale(1.03)}
.tile__key{
  position:absolute;top:.6rem;left:.7rem;
  font-family:var(--font-sans);font-size:.6rem;letter-spacing:.18em;color:var(--sand);opacity:.5;
}

/* ---------- multi select ---------- */
.multi{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:clamp(1.2rem,3vh,2rem);max-width:760px}
.opt{
  padding:.6rem 1.05rem;border-radius:999px;
  border:1px solid rgba(215,206,195,.26);color:var(--sand);
  font-size:.88rem;line-height:1.2;
  animation:rise .4s var(--ease) both;animation-delay:calc(var(--i) * 22ms);
  transition:border-color .22s ease,background .22s ease,color .22s ease,transform .3s var(--spring);
}
.opt:hover{border-color:var(--cream);color:var(--cream);transform:translateY(-2px)}
.opt.sel{background:var(--ember);border-color:var(--ember);color:var(--cream)}
.count{margin-top:1rem;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--sand);opacity:.45}

/* ---------- intro / section cards / done ---------- */
.big{font-family:var(--font-display);font-weight:400;font-size:clamp(1.9rem,5.4vw,3.4rem);line-height:1.06;letter-spacing:-.02em}
.rule{width:44px;height:1px;background:var(--bronze);margin:1.5rem 0}
.notes{display:grid;gap:.55rem;margin-top:1.5rem;max-width:46ch}
.note{display:flex;gap:.75rem;color:var(--sand);font-size:.92rem;line-height:1.5}
.note b{color:var(--bronze);font-family:var(--font-display);font-weight:400}
.btn{
  display:inline-flex;align-items:center;gap:.7rem;margin-top:1.9rem;
  padding:.85rem 1.7rem;border-radius:999px;background:var(--ember);color:var(--cream);
  font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;
  transition:transform .3s var(--ease),box-shadow .3s var(--ease),opacity .25s ease;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(235,100,46,.28)}
.btn[disabled]{
  background:none;border:1px solid rgba(215,206,195,.22);color:var(--sand);
  opacity:.55;pointer-events:none;box-shadow:none;
}
.btn--ghost{background:none;border:1px solid rgba(215,206,195,.35);color:var(--sand)}
.btn--ghost:hover{border-color:var(--cream);color:var(--cream);box-shadow:none}
.btn--sm{margin-top:1.1rem;padding:.7rem 1.3rem;font-size:.72rem}

/* ---------- fields ---------- */
.fields{display:grid;gap:1.4rem;margin-top:1.9rem;max-width:460px}

/* intro: email sits to the left of the CTA */
.startrow{display:flex;align-items:flex-end;gap:1.4rem;margin-top:1.9rem;max-width:620px;flex-wrap:wrap}
.startrow .field{position:relative;flex:1 1 260px;min-width:220px;margin:0}
.startrow .field .err{position:absolute;top:100%;left:0;margin-top:.35rem}
.startrow .btn{margin-top:0;flex:0 0 auto}
@media (max-width:560px){
  /* stacked: flex-basis would otherwise become a height and stretch the field */
  .startrow{flex-direction:column;align-items:stretch;gap:1.6rem}
  .startrow .field{flex:0 0 auto}
  .startrow .btn{align-self:flex-start}
}
.field label{display:block;font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--sand);opacity:.65;margin-bottom:.5rem}
.field input{
  width:100%;padding:.55rem 0;background:none;border:none;
  border-bottom:1px solid rgba(215,206,195,.3);color:var(--cream);
  font-family:var(--font-display);font-size:1.15rem;font-weight:400;border-radius:0;
  transition:border-color .25s ease;
}
.field input::placeholder{color:rgba(215,206,195,.3)}
.field input:focus{outline:none;border-bottom-color:var(--ember)}
.field.bad input{border-bottom-color:var(--ember)}
.field .err{display:none;margin-top:.4rem;font-size:.75rem;color:var(--ember)}
.field.bad .err{display:block}
input[type="date"]{color-scheme:dark}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
/* city picker + pincode */
.combo{position:relative}
.combo__list{
  position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:6;
  max-height:min(240px,38vh);overflow-y:auto;
  background:#1a2438;border:1px solid rgba(215,206,195,.25);border-radius:3px;
  box-shadow:0 18px 40px rgba(0,0,0,.45);
}
.combo__opt{
  display:flex;justify-content:space-between;gap:1rem;align-items:baseline;
  padding:.6rem .9rem;font-size:.95rem;color:var(--sand);cursor:pointer;
  border-bottom:1px solid rgba(215,206,195,.07);
}
.combo__opt:last-child{border-bottom:none}
.combo__opt.on,.combo__opt:hover{background:rgba(235,100,46,.2);color:var(--cream)}
.combo__st{font-size:.76rem;opacity:.5;white-space:nowrap}
.combo__opt--other{color:var(--ember);font-style:italic}
.geo{display:grid;gap:1.5rem;margin-top:1.9rem;max-width:460px}
.geo .field{position:relative;margin:0}
#i-pin{letter-spacing:.22em;font-variant-numeric:tabular-nums}
.chosen{display:flex;align-items:center;gap:.6rem;font-family:var(--font-display);font-size:1.15rem;color:var(--cream);padding:.55rem 0;border-bottom:1px solid rgba(215,206,195,.3)}
.chosen button{margin-left:auto;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--sand);opacity:.7}
.chosen button:hover{color:var(--ember);opacity:1}

/* consent — unticked by default, never a condition of joining */
.consent{display:flex;align-items:flex-start;gap:.8rem;margin-top:1.6rem;max-width:46ch;cursor:pointer}
.consent input{position:absolute;width:1px;height:1px;opacity:0}
.consent__box{
  flex:0 0 auto;width:20px;height:20px;margin-top:.15rem;
  border:1px solid rgba(215,206,195,.45);border-radius:3px;
  display:grid;place-items:center;
  transition:background .2s ease,border-color .2s ease;
}
.consent__box::after{
  content:"";width:10px;height:6px;
  border-left:2px solid var(--cream);border-bottom:2px solid var(--cream);
  transform:rotate(-45deg) scale(.5);transform-origin:center;
  opacity:0;transition:opacity .18s ease,transform .18s var(--spring);
  margin-top:-3px;
}
.consent:hover .consent__box{border-color:var(--sand)}
.consent input:checked + .consent__box{background:var(--ember);border-color:var(--ember)}
.consent input:checked + .consent__box::after{opacity:1;transform:rotate(-45deg) scale(1)}
.consent input:focus-visible + .consent__box{border-color:var(--cream);box-shadow:0 0 0 3px rgba(235,100,46,.28)}
.consent__text{font-size:.85rem;line-height:1.5;color:var(--sand)}

.status{margin-top:1rem;font-size:.85rem;color:var(--ember);max-width:46ch}

/* ---------- preview panel ---------- */
.dump{margin-top:1.6rem;max-height:44vh;overflow:auto;border:1px solid rgba(215,206,195,.2);padding:1rem;font-size:.76rem;color:var(--sand);display:none}
.dump.on{display:block}
.dump table{width:100%;border-collapse:collapse}
.dump td{padding:.3rem 0;vertical-align:top;border-bottom:1px solid rgba(215,206,195,.1)}
.dump td:last-child{text-align:right;color:var(--cream);padding-left:1rem}
.dump .miss{color:var(--ember)}

/* ---------- footer ---------- */
.foot{display:flex;align-items:center;justify-content:space-between;gap:1rem;font-size:.7rem;letter-spacing:.1em;color:var(--sand);opacity:.5}
.back{display:inline-flex;align-items:center;gap:.5rem;text-transform:uppercase;letter-spacing:.16em;font-size:.68rem;transition:opacity .25s ease;opacity:0;pointer-events:none}
.back.on{opacity:1;pointer-events:auto}
.back:hover{color:var(--cream)}
.hint kbd{font-family:var(--font-sans);font-size:.66rem;border:1px solid rgba(215,206,195,.3);border-radius:3px;padding:.1rem .34rem;margin:0 .12rem}

@media (max-width:760px){
  .rapid{grid-template-columns:1fr}
  .tile{min-height:90px}
}
@media (max-width:640px){
  :root{--hud:84px}
  .hint{display:none}
  .part{display:none}
  .hud__table{width:52px;height:52px}
  .hud__note{font-size:.6rem;letter-spacing:.16em}
}
@media (max-width:560px){
  .scale{--dot-base:30px}
  .scale--8{--dot-step:2.6px}
  /* eleven dots have to survive a 320px screen, so they track the viewport */
  .scale--11{--dot-base:clamp(17px,5.6vw,26px);--dot-step:1px}
  .dots{gap:clamp(.12rem,.8vw,.25rem)}
  .dot{font-size:.82rem}
  .scale--11 .dot{font-size:.68rem}
  .ends{font-size:.56rem;letter-spacing:.05em}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .hud__you{transition:left .01ms!important}
}
</style>

const STEPS = [{ kind:"intro" }];
QUESTIONS.forEach((q,i) => {
  const newSection = i === 0 || QUESTIONS[i-1].s !== q.s;
  const cardCfg = SECTION_CARDS[SECTIONS[q.s].key];
  if (newSection && cardCfg) STEPS.push({ kind:"card", cfg:cardCfg, s:q.s });
  STEPS.push({ kind:"q", q });
});
STEPS.push({ kind:"details" }, { kind:"done" });

const TOTAL   = QUESTIONS.length;
const LETTERS = ["A","B","C","D","E","F"];
const STORE   = "tryb-form-v2";

let answers = {};          // id -> value, [] for multi, or null when a clock ran out
let details = { name:"", email:"", phone:"", consent:false };
let step = 0, ticker = null, locked = false, sending = false, finished = false;
let startedAt = Date.now();
let sessionId = "";        // one per visitor journey, so drop-offs can be counted
let furthest  = 0;         // highest step index reached

const card  = document.getElementById("card");
const back  = document.getElementById("back");
const hint  = document.getElementById("hint");
const label = document.getElementById("partLabel");
const hud   = document.getElementById("hud");
const you   = document.getElementById("you");
const note  = document.getElementById("hudNote");

/* ---------- draft ---------- */
function saveDraft(){
  if (finished) return;
  try { localStorage.setItem(STORE, JSON.stringify({ answers, details, startedAt, sessionId, furthest })); } catch (e) {}
}
function clearDraft(){ try { localStorage.removeItem(STORE); } catch (e) {} }

const answered = q => {
  const a = answers[q.id];
  if (a === undefined) return false;
  return Array.isArray(a) ? a.length > 0 : true;      // null counts: the clock ran out
};
const answeredCount = () => QUESTIONS.filter(answered).length;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

/* ---------- the walk ---------- */
const NOTES = [
  [0,    "setting out"],
  [0.18, "on your way"],
  [0.45, "getting closer"],
  [0.72, "almost there"],
  [0.93, "one seat away"]
];
function paintProgress(stepped){
  const p = Math.min(answeredCount() / TOTAL, 1);
  you.style.left = (p * 100).toFixed(2) + "%";
  const arrived = p >= 1;
  hud.classList.toggle("arrived", arrived);
  note.textContent = arrived ? "you're at the table"
                             : NOTES.filter(n => p >= n[0]).pop()[1];
  if (stepped && !arrived){
    hud.classList.remove("step"); void hud.offsetWidth; hud.classList.add("step");
  }
}

function go(next){
  if (locked) return;
  locked = true;
  clearTimer();
  card.classList.add("is-out");
  setTimeout(() => {
    step = next;
    if (step > furthest) furthest = step;
    render();
    card.classList.remove("is-out","is-in");
    void card.offsetWidth;
    card.classList.add("is-in");
    locked = false;
  }, 240);
}

function render(){
  const s = STEPS[step];
  label.textContent = s.kind === "q" ? SECTIONS[s.q.s].label : "";
  back.classList.toggle("on", step > 0 && s.kind !== "done");
  hint.innerHTML = "";
  paintProgress();

  if (s.kind === "intro")   return renderIntro();
  if (s.kind === "card")    return renderCard(s);
  if (s.kind === "details") return renderDetails();
  if (s.kind === "done")    return renderDone();

  const q = s.q;
  if (q.type === "scale")  return renderScale(q);
  if (q.type === "choice") return renderChoice(q);
  if (q.type === "rapid")  return renderRapid(q);
  if (q.type === "multi")  return renderMulti(q);
  if (q.type === "date")   return renderDate(q);
  if (q.type === "geo")    return renderGeo(q);
  return renderText(q);
}

  if (r) r.onclick = () => {
    answers = {}; details = { name:"", email:"", phone:"", consent:false };
    startedAt = Date.now(); leadSent = false; clearDraft(); paintProgress(); render();
  };
  hint.innerHTML = `press <kbd>enter</kbd> to begin`;
}

/**
 * Take the email before the first question, so someone who never finishes is
 * still reachable. Recorded to its own tab; the walk itself is unchanged.
 */
function startWalking(resumable){
  const field = card.querySelector("#f-lead");
  const input = card.querySelector("#i-lead");
  const email = (input.value || "").trim();

  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){
    field.classList.add("bad");
    input.focus();
    return;
  }
  details.email = email;          // the final screen is then already filled in
  saveDraft();
  captureLead(email);             // fire and forget — never delays the form
  go(resumable ? firstUnanswered() : step + 1);
}

let leadSent = false;
function captureLead(email){
  if (leadSent || !SHEET_ENDPOINT) return;
  leadSent = true;
  try {
    fetch(SHEET_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        token: SUBMIT_TOKEN, type: "lead",
        session: sessionId, email: email,
        referrer: document.referrer || ""
      }),
      keepalive: true
    }).catch(function(){});
  } catch (e) {}
}

function firstUnanswered(){
  for (let i = 1; i < STEPS.length; i++){
    const s = STEPS[i];
    if (s.kind === "q" && !answered(s.q)) return i;
  }
  return STEPS.findIndex(s => s.kind === "details");
}

/* Scales run lo…hi — every scale here starts at 0. */
const lo = q => (q.min === undefined ? 1 : q.min);
const steps = q => q.max - lo(q) + 1;

function renderScale(q){
  let labels = q.labels || AGREE;
  if (labels.length === 2) labels = [labels[0], "", labels[1]];
  const mid = (lo(q) + q.max) / 2;
  const dots = Array.from({ length:steps(q) }, (_,i) => {
    const v = lo(q) + i;
    const sel = answers[q.id] === v ? " sel" : "";
    return `<button class="dot${sel}" data-v="${v}" style="--k:${Math.abs(v - mid)};--i:${i}"
              aria-label="${v} of ${q.max}">${v}</button>`;
  }).join("");

  card.innerHTML = `
    <p class="eyebrow">${esc(SECTIONS[q.s].label)}</p>
    <h2 class="q">${esc(q.text)}</h2>
    <div class="scale scale--${steps(q)}">
      <div class="dots">${dots}</div>
      <div class="ends"><span>${esc(labels[0])}</span><span>${esc(labels[1])}</span><span>${esc(labels[2])}</span></div>
    </div>`;

  card.querySelectorAll(".dot").forEach(b => { b.onclick = () => pick(q, Number(b.dataset.v), b); });
  hint.innerHTML = steps(q) > 10
    ? `click to answer &nbsp;·&nbsp; <kbd>←</kbd> to go back`
    : `<kbd>${lo(q)}</kbd>–<kbd>${q.max}</kbd> to answer &nbsp;·&nbsp; <kbd>←</kbd> to go back`;
}

function renderMulti(q){

  card.querySelectorAll(".opt").forEach(b => {
    b.onclick = () => {

      answers[q.id] = list;
      b.classList.toggle("sel", at === -1);

function cityLabel(c){ return c[0] + ", " + STATES[c[1]]; }

function renderGeo(q){
  const cur = answers[q.id] || { city:"", pin:"" };
  card.innerHTML = `
    <p class="eyebrow">${esc(SECTIONS[q.s].label)}</p>
    <h2 class="q">${esc(q.text)}</h2>
    <div class="geo">
      <div class="field combo" id="f-city">

        <div id="city-slot"></div>
        <p class="err">Pick your city from the list.</p>
      </div>
      <div class="field" id="f-pin">
        <label for="i-pin">Pincode</label>
        <input id="i-pin" type="text" inputmode="numeric" autocomplete="postal-code"
               placeholder="110001" value="${esc(cur.pin)}" />
        <p class="err">A pincode is six digits.</p>
      </div>
    </div>
    ${q.note ? `<p class="sub">${esc(q.note)}</p>` : ""}
    <button class="btn" id="next">Continue <span>&rarr;</span></button>`;

  const slot = card.querySelector("#city-slot");
  let picked = cur.city || "";          // only ever set by choosing, or by the manual box

  function showChosen(){
    slot.innerHTML = `<div class="chosen"><span>${esc(picked)}</span>
      <button type="button" id="city-clear">Change</button></div>`;
    slot.querySelector("#city-clear").onclick = () => { picked = ""; showSearch(""); };
  }

  function showManual(){
    slot.innerHTML = `<input id="i-manual" type="text" autocapitalize="words"
      placeholder="Type your city" value="" />`;
    const m = slot.querySelector("#i-manual");
    m.oninput = () => { picked = m.value.trim(); card.querySelector("#f-city").classList.remove("bad"); };
    m.focus();
  }

  function showSearch(initial){
    slot.innerHTML = `<input id="i-city" type="text" autocomplete="off" spellcheck="false"
      role="combobox" aria-expanded="false" placeholder="Start typing — e.g. Gurgaon" value="${esc(initial)}" />`;
    const input = slot.querySelector("#i-city");
    let list = null, hi = -1, shown = [];

    const close = () => { if (list) list.remove(); list = null; hi = -1; };

    function open(f){
      close();
      const t = f.trim().toLowerCase();
      shown = (t ? CITIES.filter(c =>
                 c[0].toLowerCase().includes(t) || (c[2] && c[2].toLowerCase().includes(t))
               ) : CITIES).slice(0, 80);
      list = document.createElement("div");
      list.className = "combo__list";
      list.innerHTML = shown.map((c,i) =>
          `<div class="combo__opt" data-i="${i}"><span>${esc(c[0])}</span><span class="combo__st">${esc(STATES[c[1]])}</span></div>`
        ).join("") +
        `<div class="combo__opt combo__opt--other" data-i="${CITY_OTHER}">My city isn't listed</div>`;
      slot.appendChild(list);
      list.querySelectorAll(".combo__opt").forEach(el => {
        el.onmousedown = e => { e.preventDefault(); pickOpt(el.dataset.i); };
      });
    }

    function pickOpt(i){
      if (i === CITY_OTHER){ close(); showManual(); return; }
      picked = cityLabel(shown[Number(i)]);
      card.querySelector("#f-city").classList.remove("bad");
      close(); showChosen();
      card.querySelector("#i-pin").focus();
    }

    input.oninput = () => { picked = ""; open(input.value); };
    input.onfocus = () => { if (input.value.trim()) open(input.value); };
    input.onblur  = () => setTimeout(close, 120);
    input.onkeydown = e => {
      if (e.key === "ArrowDown" || e.key === "ArrowUp"){
        e.preventDefault();
        if (!list) return open(input.value);
        const opts = list.querySelectorAll(".combo__opt");
        hi = (hi + (e.key === "ArrowDown" ? 1 : -1) + opts.length) % opts.length;
        opts.forEach((o,k) => o.classList.toggle("on", k === hi));
        opts[hi].scrollIntoView({ block:"nearest" });
      } else if (e.key === "Escape"){ close(); }
      else if (e.key === "Enter" && list && hi > -1){
        e.preventDefault(); e.stopPropagation();
        pickOpt(list.querySelectorAll(".combo__opt")[hi].dataset.i);
      }
    };
    if (initial) setTimeout(() => input.focus(), 10);
  }

  if (picked) showChosen(); else showSearch("");

  const pin = card.querySelector("#i-pin");
  pin.oninput = () => {
    pin.value = pin.value.replace(/\D/g, "").slice(0, 6);
    card.querySelector("#f-pin").classList.remove("bad");
  };
  card.querySelector("#next").onclick = () => commitGeo(q, () => picked);
  hint.innerHTML = `<kbd>↑</kbd><kbd>↓</kbd> to pick &nbsp;·&nbsp; <kbd>enter</kbd> to continue`;
}

  if (!/^[1-9][0-9]{5}$/.test(pin)){ card.querySelector("#f-pin").classList.add("bad"); ok = false; }

}

function commitDate(q){

/* ============================================================
   5 · ANSWERING
   ============================================================ */
function pick(q, value, el){
  if (locked) return;
  locked = true;
  clearTimer();
  answers[q.id] = value;
  card.querySelectorAll(".dot,.choice,.tile").forEach(n => n.classList.remove("sel"));
  el.classList.add("sel");
  paintProgress(true);
  saveDraft();
  setTimeout(() => { locked = false; go(step + 1); }, 340);
}

function answerLabel(q){
  const a = answers[q.id];
  if (a === null || a === undefined || a === "") return "—";
  if (Array.isArray(a)) return a.length ? a.map(i => q.options[i]).join("; ") : "—";
  if (q.type === "geo")  return a.city + " — " + a.pin;
  if (q.type === "text" || q.type === "date") return a;
  if (q.type === "scale") return a + " / " + q.max;
  return LETTERS[a] + " — " + q.options[a];
}

/* ---------- the rapid-fire clock ---------- */
function startTimer(q){
  const wrap = card.querySelector("#timer");
  const bar  = card.querySelector("#tbar");
  const num  = card.querySelector("#tnum");
  requestAnimationFrame(() => wrap.classList.add("on"));

  const end = performance.now() + RAPID_SECONDS * 1000;
  const tick = now => {
    const left = Math.max(0, end - now);
    bar.style.transform = `scaleX(${left / (RAPID_SECONDS * 1000)})`;
    num.textContent = Math.ceil(left / 1000);
    wrap.classList.toggle("warn", left <= 3000);
    if (left <= 0){
      ticker = null;
      answers[q.id] = null;              // ran out — recorded as a non-answer
      paintProgress(true);
      saveDraft();
      go(step + 1);
      return;
    }
    ticker = requestAnimationFrame(tick);
  };
  ticker = requestAnimationFrame(tick);
}
function clearTimer(){
  if (ticker) cancelAnimationFrame(ticker);
  ticker = null;
}

/* ============================================================
   6 · JOIN THE WAITLIST
   ============================================================ */
function validate(){
  let ok = true;
  const bad = id => { card.querySelector("#f-" + id).classList.add("bad"); ok = false; };
  if (!details.name.trim()) bad("name");
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(details.email.trim())) bad("email");
  if (!/^[+\d][\d\s()-]{6,}$/.test(details.phone.trim())) bad("phone");
  return ok;
}

function payload(){
  return {
    token: SUBMIT_TOKEN,
    session: sessionId,
    website: (document.querySelector("#i-hp") || {}).value || "",   // honeypot
    submittedAt: new Date().toISOString(),
    name: details.name.trim(),
    email: details.email.trim(),
    phone: details.phone.trim(),
    consent: !!details.consent,
    consentAt: details.consent ? new Date().toISOString() : "",
    utmSource:   campaign.utm_source   || "",
    utmMedium:   campaign.utm_medium   || "",
    utmCampaign: campaign.utm_campaign || "",
    utmContent:  campaign.utm_content  || "",
    fbclid:      campaign.fbclid       || "",
    answers: QUESTIONS.flatMap(q => {
      if (q.type === "geo"){
        const a = answers[q.id] || {};
        return [{ id:q.id,          question:"Which city do you live in?", answer:a.city || "—" },
                { id:q.id + "-pin", question:"Pincode",                    answer:a.pin  || "—" }];
      }
      // `column` keeps a question in its original sheet column when the wording changes
      return [{ id:q.id, question:q.column || q.text, answer:answerLabel(q) }];
    }),
    timedOut: QUESTIONS.filter(q => answers[q.id] === null).length,
    durationSeconds: Math.round((Date.now() - startedAt) / 1000)
  };
}

async function submit(){
  if (sending) return;
  const status = card.querySelector("#status");
  if (!validate()){ status.textContent = "A couple of fields need a look."; return; }

  if (!SHEET_ENDPOINT){                 // preview mode
    finished = true; clearDraft(); go(STEPS.length - 1); return;
  }

  sending = true;
  const btn = card.querySelector("#submit");
  btn.disabled = true;
  btn.innerHTML = "Joining…";
  status.textContent = "";

  let reason = "";
  try {
    // text/plain keeps this a "simple" request, so the browser skips the CORS
    // preflight that Apps Script cannot answer.
    const res = await fetch(SHEET_ENDPOINT, {
      method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" },
      body: JSON.stringify(payload())
    });

    const text = await res.text();
    let data = null;
    try { data = JSON.parse(text); } catch (e) {}

    if (!data){
      // Apps Script answered with something that is not our JSON — almost always
      // its own error page, which means the deployment is not running this script.
      reason = "the endpoint replied with " + res.status + ", not JSON";
      console.error("[tryb] unexpected response from SHEET_ENDPOINT:", res.status, text.slice(0, 400));
      throw new Error(reason);
    }
    if (!data.ok){
      reason = data.error || "the script rejected it";
      console.error("[tryb] script returned an error:", data);
      throw new Error(reason);
    }

    // Meta Pixel conversion — only once the submission is confirmed saved, so ad
    // optimisation counts real registrations. The address bar is switched to
    // ?registered=1 FIRST, so the events below carry that URL and Meta can also
    // match a URL-based custom conversion on it. Guarded in case the pixel is
    // blocked by an ad blocker.
    try { history.replaceState(null, "", location.pathname + "?registered=1"); } catch (e) {}
    try {
      if (typeof fbq === "function") {
        fbq("track", "CompleteRegistration");
        fbq("track", "PageView");   // so Meta records the ?registered=1 URL
      }
    } catch (e) {}

    finished = true; clearDraft(); sending = false;
    go(STEPS.length - 1);
  } catch (err) {
    // A TypeError here is the browser refusing the response: the deployment is
    // not set to "Anyone", so Google redirects to a sign-in page with no CORS.
    if (!reason){
      reason = (err instanceof TypeError)
        ? "the browser was blocked — the web app is probably not shared with “Anyone”"
        : err.message;
      console.error("[tryb] submit failed:", err);
    }
    sending = false;
    btn.disabled = false;
    btn.innerHTML = 'Try again <span>&rarr;</span>';
    status.innerHTML = `That didn't send — your answers are saved, so nothing is lost.
      Try once more, or email us at <a href="mailto:team@jointryb.in" style="color:var(--ember)">team@jointryb.in</a>.
      <br /><span style="opacity:.6;font-size:.78em">Reason: ${esc(reason)}</span>`;
  }
}

/* ============================================================
   7 · KEYBOARD
   ============================================================ */
document.addEventListener("keydown", e => {
  if (locked) return;
  const s = STEPS[step];
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((e.target || {}).tagName || "");

  if (e.key === "Enter"){
    if (s.kind === "intro"){ e.preventDefault(); startWalking(answeredCount() > 0); return; }
    if (s.kind === "card"){ e.preventDefault(); go(step + 1); return; }
    if (s.kind === "details"){ e.preventDefault(); submit(); return; }
    if (s.kind === "q"){
      if (s.q.type === "text"){ e.preventDefault(); commitText(s.q); return; }
      if (s.q.type === "date"){ e.preventDefault(); commitDate(s.q); return; }
      if (s.q.type === "geo"){ e.preventDefault(); card.querySelector("#next").click(); return; }
      if (s.q.type === "multi" && (answers[s.q.id] || []).length){ e.preventDefault(); go(step + 1); return; }
    }
  }
  if (typing) return;                       // never hijack keys while a field has focus

  if ((e.key === "ArrowLeft" || e.key === "Backspace") && step > 0 && s.kind !== "done"){
    e.preventDefault(); go(step - 1); return;
  }
  if (s.kind !== "q") return;
  const q = s.q;

  if (q.type === "scale"){
    // A 0–10 scale cannot be keyed unambiguously (1 vs 10), so it is click-only.
    const n = Number(e.key);
    if (steps(q) <= 10 && e.key.length === 1 && n >= lo(q) && n <= q.max){
      const el = card.querySelector(`.dot[data-v="${n}"]`);
      if (el) pick(q, n, el);
    }
  } else if (q.type === "choice" || q.type === "rapid"){
    const i = LETTERS.indexOf(e.key.toUpperCase());
    if (i > -1 && i < q.options.length){
      const el = card.querySelector(`[data-v="${i}"]`);
      if (el) pick(q, i, el);
    }
  }
});


/* ============================================================
   8 · WHERE PEOPLE LEAVE
   A single fire-and-forget beacon when the page is closed or
   backgrounded, recording the furthest point reached. Upserted by
   session, so one row per visitor. Never blocks or breaks the form.
   ============================================================ */
function stepLabel(i){
  const s = STEPS[i];
  if (!s) return { id:"", text:"", section:"" };
  if (s.kind === "intro")   return { id:"intro",   text:"Intro screen",        section:"—" };
  if (s.kind === "card")    return { id:"card",    text:"Section card: " + SECTIONS[s.s].label, section:SECTIONS[s.s].label };
  if (s.kind === "details") return { id:"details", text:"Name / email / phone", section:"Waitlist" };
  if (s.kind === "done")    return { id:"done",    text:"Finished",             section:"—" };
  return { id:s.q.id, text:s.q.text, section:SECTIONS[s.q.s].label };
}

let beaconSent = false;
function reportExit(){
  if (beaconSent || finished || !SHEET_ENDPOINT) return;
  beaconSent = true;                       // one report per page life
  try {
    const at = stepLabel(furthest);
    navigator.sendBeacon(SHEET_ENDPOINT, JSON.stringify({
      token: SUBMIT_TOKEN,
      type: "dropoff",
      session: sessionId,
      lastStep: furthest,
      lastQuestionId: at.id,
      lastQuestion: at.text,
      section: at.section,
      answered: answeredCount(),
      total: TOTAL,
      seconds: Math.round((Date.now() - startedAt) / 1000),
      viewport: innerWidth + "x" + innerHeight,
      ua: navigator.userAgent,
      referrer: document.referrer || ""
    }));
  } catch (e) {}                           // analytics must never break the form
}

// pagehide is the reliable one on mobile Safari; visibilitychange covers tab switches.
addEventListener("pagehide", reportExit);
addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") reportExit(); });

back.onclick = () => { if (step > 0) go(step - 1); };

/* ---------- boot ---------- */
(() => {
  try {
    const d = JSON.parse(localStorage.getItem(STORE) || "null");
    if (d){
      answers   = d.answers || {};
      details   = Object.assign(details, d.details || {});
      startedAt = d.startedAt || Date.now();
      sessionId = d.sessionId || "";
      furthest  = d.furthest  || 0;
    }
  } catch (e) {}
  if (!sessionId){
    sessionId = Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
  }
  saveDraft();
  render();                     // always open on the intro, which offers to resume
  card.classList.add("is-in");
})();
</script>
